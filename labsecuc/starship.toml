# --- Ruta: cápsula azul con icono de carpeta; cierra en punta al terminal ---
[directory]
style = "fg:claro bg:azul"
format = "[  $path$read_only ](bold $style)[](fg:azul) "
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = false
read_only = " 󰌾"

# --- Git: cápsula verde propia (rama oscura + estado en naranja) ---
# Símbolo oficial del preset nerd-font-symbols.
[git_branch]
symbol = " "
format = "[](fg:verde)[ $symbol$branch](fg:oscuroT bg:verde)"

[git_status]
format = "[$all_status$ahead_behind](fg:naranja bg:verde)[](fg:verde) "
conflicted = " =${count}"
untracked = " ?${count}"
modified = " !${count}"
staged = " +${count}"
renamed = " »${count}"
deleted = " ✘${count}"
stashed = " *${count}"
ahead = " ⇡${count}"
behind = " ⇣${count}"

# --- Duración: cápsula gris (solo si tardó ≥500 ms) ---
[cmd_duration]
min_time = 500
format = "[](fg:gris)[  $duration ](fg:claro bg:gris)[](fg:gris) "

# --- Estado de salida: cápsula roja (solo si hubo error) ---
[status]
disabled = false
format = "[](fg:rojo)[ ✘ $status ](bold fg:claro bg:rojo)[](fg:rojo) "

# --- Contexto usuario@host: cápsula azul fusionada ---
[username]
show_always = true
style_user = "fg:claro bg:azul"
style_root = "bold fg:claro bg:azul"
format = "[](fg:azul)[ $user](bold $style)"

[hostname]
ssh_only = false
format = "[@$hostname ](fg:claro bg:azul)[](fg:azul) "

# --- Hora: cápsula gris ---
[time]
disabled = false
format = "[](fg:gris)[  $time ](fg:claro bg:gris)[](fg:gris)"
time_format = "%H:%M:%S"

# --- Carácter de prompt: verde en éxito, rojo en error ---
[character]
success_symbol = "[❯](bold fg:verde)"
error_symbol = "[❯](bold fg:rojo)"
vicmd_symbol = "[❮](bold fg:claro)"
