# Barra tmux con la identidad de la Universidad de Cuenca (Kit de Marca 2026).
# Cápsulas redondeadas a juego con el prompt Starship: azul dominante,
# rojo como acento (ventana activa) y gris para el reloj.
#   azul #002856 · rojo #a51008 · gris #6f6f6f · claro #dadada

# Color real de 24 bits. El override por nombre no basta: docker exec entra
# con TERM=xterm, que no casa con *256col*; terminal-features fuerza RGB.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc"
set -as terminal-features ",*:RGB"

# Ratón, historial amplio y numeración desde 1.
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Recarga rápida de la configuración con "prefijo r".
unbind r
bind r source-file /etc/tmux.conf \; display "tmux.conf recargado"

# Dividir paneles manteniendo el directorio actual (| horizontal, - vertical).
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- Paleta UCuenca ---
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default fg=#dadada"

# Izquierda: sesión en cápsula azul redondeada.
set -g status-left-length 40
set -g status-left "#[fg=#002856]#[bg=#002856,fg=#ffffff,bold]  #S #[fg=#002856,bg=default] "

# Ventanas: activa en cápsula roja (acento); inactivas en gris tenue.
setw -g window-status-format "#[fg=#6f6f6f] #I:#W "
setw -g window-status-current-format "#[fg=#a51008]#[bg=#a51008,fg=#ffffff,bold] #I:#W #[fg=#a51008,bg=default]"
setw -g window-status-separator ""

# Derecha: usuario@host (cápsula azul) y hora (cápsula gris).
set -g status-right-length 80
set -g status-right "#[fg=#002856]#[bg=#002856,fg=#dadada,bold]  #(whoami)@#H #[fg=#002856,bg=default] #[fg=#6f6f6f]#[bg=#6f6f6f,fg=#dadada,bold]  %H:%M #[fg=#6f6f6f,bg=default]"

# Bordes y mensajes.
set -g pane-border-style "fg=#6f6f6f"
set -g pane-active-border-style "fg=#a51008"
set -g message-style "bg=#002856,fg=#ffffff,bold"
set -g display-time 1500
