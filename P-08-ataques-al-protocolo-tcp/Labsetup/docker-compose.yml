services:
    attacker:
        image: fabianastudillo/labsecuc:latest
        container_name: seed-attacker
        hostname: attacker
        tty: true
        cap_add:
                - ALL
        privileged: true
        volumes:
                - ./volumes:/volumes
        network_mode: host


    Victim:
        image: fabianastudillo/labsecuc:latest
        container_name: victim-10.9.0.5
        hostname: victim
        tty: true
        cap_add:
                - ALL
        privileged: true
        sysctls:
                - net.ipv4.tcp_syncookies=0

        networks:
            net-10.9.0.0:
                ipv4_address: 10.9.0.5

        volumes:
                - ./volumes:/volumes

        command: bash -c "
                      /etc/init.d/openbsd-inetd start  &&
                      tail -f /dev/null
                 "
                  
    User1:
        image: fabianastudillo/labsecuc:latest
        container_name: user1-10.9.0.6
        hostname: user1
        tty: true
        cap_add:
                - ALL
        networks:
            net-10.9.0.0:
                ipv4_address: 10.9.0.6

        command: bash -c "
                      /etc/init.d/openbsd-inetd start  &&
                      tail -f /dev/null
                 "
        volumes:
                - ./volumes:/volumes


    User2:
        image: fabianastudillo/labsecuc:latest
        container_name: user2-10.9.0.7
        hostname: user2
        tty: true
        cap_add:
                - ALL
        networks:
            net-10.9.0.0:
                ipv4_address: 10.9.0.7

        command: bash -c "
                      /etc/init.d/openbsd-inetd start  &&
                      tail -f /dev/null
                 "
        volumes:
                - ./volumes:/volumes


networks:
    net-10.9.0.0:
        name: net-10.9.0.0
        ipam:
            config:
                - subnet: 10.9.0.0/24

