# Prompt powerline para los laboratorios: Tux en cápsula oscura, ruta en azul
# y bloque git en verde con los contadores en naranja (estilo de la captura 1).
#
# Separadores powerline:  (U+E0B0, derecha) y  (U+E0B2, izquierda).
# Requiere una Nerd Font en la terminal para los glifos    .
#
# Robustez: os y directory van conectados (siempre presentes); el bloque git
# es una cápsula propia, así que si no hay repo no deja cuñas huérfanas.

add_newline = true
palette = "lab"

format = """
$os\
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$status\
$username\
$hostname\
$time\
$line_break\
$character"""

[palettes.lab]
oscuro  = "#30343c"   # cápsula del SO (Tux)
azul    = "#2f6fb5"   # ruta
verde   = "#39a845"   # git
naranja = "#f2b23a"   # contadores de git
gris    = "#454a53"   # duración / hora
rojo    = "#d2443a"   # errores
claro   = "#e8eaed"   # texto sobre fondos oscuros
oscuroT = "#15181d"   # texto sobre verde (rama)

[fill]
symbol = " "

# --- SO: cápsula oscura con el icono del SO, conectada con la ruta ---
# Símbolos oficiales del preset nerd-font-symbols (https://starship.rs/presets/nerd-font).
[os]
disabled = false
format = "[ $symbol](fg:claro bg:oscuro)[](fg:oscuro bg:azul)"
